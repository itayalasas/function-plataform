services:
  api:
    build: ./api
    env_file:
      - .env
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
      PUBLIC_HOST: localhost
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - fn_workdir:/workdir
    ports:
      - "4000:4000"

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  fn_workdir:
